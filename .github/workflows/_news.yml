name: news build + publish (reusable)
# One lane run (owner-approved redesign 2026-10-05): build ONE news card or
# reel, reserve it on main (dedupe for sibling lanes), push its media, WAIT
# until the slot's local time (slot.py; the caller cron fires 2-3h early
# because GitHub crons run late), then publish. Nothing passing the gates =
# empty slot, by design (better skip than filler).

on:
  workflow_call:
    inputs:
      lang: {required: true, type: string}   # en | he
      kind: {required: true, type: string}   # card | reel
      slot: {required: true, type: string}   # index into pages.py, or "now"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # build (~20 min) + up to ~3h wait + publish
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI + Pillow
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install pillow
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          CHROME: google-chrome
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "64000"
        run: |
          set -o pipefail
          cd ig
          python news.py ${{ inputs.kind }} ${{ inputs.lang }} | tee /tmp/build.log
          POST_DIR=$(sed -n 's/^post ready: //p' /tmp/build.log | tail -1)
          if [ -z "$POST_DIR" ]; then
            echo "nothing passed the gates: empty slot"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          POST_DIR="${POST_DIR#"$GITHUB_WORKSPACE"/}"
          NAME=$(basename "$POST_DIR")
          if [ "${{ inputs.lang }}" = "he" ]; then MEDIA="$NAME-he"; HE=" HE"; else MEDIA="$NAME"; HE=""; fi
          { echo "POST_DIR=$POST_DIR"; echo "NAME=$NAME"; echo "MEDIA=$MEDIA"; echo "HE=$HE"; } >> "$GITHUB_ENV"

      - name: Reserve the story on main (sibling lanes dedupe against it)
        if: env.SKIP != 'true'
        run: |
          git config user.name "ig-bot"
          git config user.email "bot@users.noreply.github.com"
          git config merge.ledger.driver "python ig/merge_ledgers.py %O %A %B"
          git add "$POST_DIR"
          git add ig/pool-en.json ig/pool-video.json ig/x-used.json ig/bundle-used.json 2>/dev/null || true
          git commit -m "IG build${HE}: $NAME"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Push media to the public media repo
        if: env.SKIP != 'true'
        env:
          TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:$TOKEN@github.com/saaryafe-crypto/kestrel-media.git" /tmp/media
          cd /tmp/media
          git sparse-checkout set "$MEDIA"
          mkdir -p "$MEDIA"
          cp "$GITHUB_WORKSPACE/$POST_DIR"/slide-1.jpg "$MEDIA/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/$POST_DIR"/reel.mp4 "$MEDIA/" 2>/dev/null || true
          git config user.name "ig-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "$MEDIA" || echo "media already there"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Wait for the slot time
        if: env.SKIP != 'true'
        run: |
          cd ig
          python slot.py wait ${{ inputs.lang }} ${{ inputs.kind }} ${{ inputs.slot }} \
            || { echo "SKIP=true" >> "$GITHUB_ENV"; }

      - name: Publish
        if: env.SKIP != 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ inputs.lang == 'he' && secrets.MAKE_WEBHOOK_URL_HE || secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python ig/post.py "$POST_DIR" \
            "https://raw.githubusercontent.com/saaryafe-crypto/kestrel-media/main/$MEDIA"

      - name: Mark published on main
        # LAST on purpose: if this fails the post is already live
        if: env.SKIP != 'true'
        run: |
          date -u +%FT%TZ > "$POST_DIR/published.txt"
          git add "$POST_DIR" ig/bundle-used.json 2>/dev/null || true
          KIND=$([ "${{ inputs.kind }}" = "reel" ] && echo reel || echo post)
          git commit -m "IG ${KIND}${HE}: $NAME"
          git pull --rebase --autostash -X theirs
          git push || { git pull --rebase --autostash -X theirs && git push; }

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "IG ${{ inputs.lang }} ${{ inputs.kind }} FAILED $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "Slot ${{ inputs.slot }} did not publish. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
