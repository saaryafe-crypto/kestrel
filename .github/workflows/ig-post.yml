name: IG news card EN
# Fires 2-3h before each slot (GitHub crons run late); _news.yml builds,
# then waits until the slot's local time (pages.py) and publishes.
on:
  schedule:
    - cron: "7 10 * * *"   # 0 slot 08:00 New York
    - cron: "37 14 * * *"   # 1 slot 12:30 New York
    - cron: "7 20 * * *"   # 2 slot 18:00 New York
  workflow_dispatch:
    inputs:
      slot:
        description: "slot index from pages.py, or now"
        default: "now"

concurrency:
  group: ig-card-en
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.s.outputs.slot }}
    steps:
      - id: s
        run: |
          case "${{ github.event.schedule }}" in
            "7 10 * * *") s=0 ;;
            "37 14 * * *") s=1 ;;
            "7 20 * * *") s=2 ;;
            *) s="${{ inputs.slot || 'now' }}" ;;
          esac
          echo "slot=$s" >> "$GITHUB_OUTPUT"
  run:
    needs: slot
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/_news.yml
    with:
      lang: en
      kind: card
      slot: ${{ needs.slot.outputs.slot }}
    secrets: inherit
