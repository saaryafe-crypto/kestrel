name: IG autopost
# 5x daily: fetch news -> write post (Claude) -> render slides -> push slides
# to the public media repo -> publish carousel via Meta Graph API.
#
# Required repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN - from `claude setup-token` (uses Claude subscription)
#   MAKE_WEBHOOK_URL   - Make.com scenario webhook (publishes carousel to IG)
#   MAKE_API_KEY       - Make.com webhook API key
#   MEDIA_REPO_TOKEN   - GitHub PAT with push access to the public media repo
#   REPLICATE_API_TOKEN - optional; enables Seedream-4 slide images ($9/mo cap in genimg.py)
# Required: public repo saaryafe-crypto/kestrel-media (hosts slide JPEGs
# so Meta's servers can fetch them).

on:
  schedule:
    # 5 CAROUSELS/DAY (owner match-the-data order Aug 27: "did they post 5?
    # post 5"). Measured Aug 27 audit, 134 posts / 14 accounts: top niche
    # pages run 3-8 carousels/day (median ~5) and carousels beat reels ~25x
    # per follower (4,381 vs 178 median likes/1M) — the 3 reel slots/day cut
    # from the Mac launchd lanes pay this token bill (net slots unchanged).
    # Hours are the measured competitor peaks: 21:00 UTC is the single
    # biggest (17 posts), then 01:00 / 13:00 / 16:00 (11 each); the old
    # 23:00 slot was a valley (3 posts) and is gone.
    # ROLLBACK RULE (the Aug 8 token diet exists because 5/day once ate the
    # whole Claude plan): the FIRST "hit your weekly limit" failure drops
    # the 16:00 slot; a second drops 01:00 (recap goes weekly). Never let
    # the limit kill prime slots to keep off-peak ones.
    #
    # ONE CRON LINE PER SLOT (owner audit Sep 3): free-tier crons fire HOURS
    # late, and slot identity used to come from the actual wall-clock hour —
    # the 01:00 recap ran at ~05:24, matched no case, and shipped a story;
    # the page went 0 recaps since Aug 27. Each slot now carries its
    # identity in github.event.schedule, immune to the delay.
    - cron: "0 1 * * *"    # recap
    - cron: "0 13 * * *"   # edu guide (the ONE guide slot of the day)
    - cron: "0 16 * * *"   # news story
    - cron: "0 17 * * *"   # news story
    - cron: "0 21 * * *"   # news story (biggest measured peak)
  workflow_dispatch:
    inputs:
      kind:
        description: "auto | story | edu | recap"
        default: "auto"
      repost:
        description: "existing posts/<name> to re-publish as-is (skips generation)"
        default: ""

# Serialize runs: on Aug 2 a reel-fallback carousel and a manual replacement
# ran in parallel, picked the SAME story, and the loser died on a rebase
# conflict at the dedupe commit (issue #17). Queued runs still fill every
# slot — they just wait their turn instead of racing.
concurrency:
  group: ig-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      # exact-hour posting forever is a mild bot fingerprint (audit Jul 29);
      # scheduled runs only — manual/recovery runs stay instant
      - name: Jitter (0-8 min)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 480))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip download cache (run diet Aug 12): onnxruntime alone is a
          # ~130MB wheel re-downloaded every slot. Keyed on this workflow
          # file — the package list lives here, so edits refresh the cache.
          cache: pip
          cache-dependency-path: .github/workflows/ig-post.yml

      - name: Repost an existing post (skip generation)
        if: github.event.inputs.repost != ''
        run: |
          echo "POST_DIR=ig/posts/${{ github.event.inputs.repost }}" >> "$GITHUB_ENV"
          echo "POST_NAME=${{ github.event.inputs.repost }}" >> "$GITHUB_ENV"
          test -f "ig/posts/${{ github.event.inputs.repost }}/slide-1.jpg"

      - name: Install Claude Code CLI + Pillow + rembg
        if: github.event.inputs.repost == ''
        run: |
          npm install -g @anthropic-ai/claude-code
          # rembg: composed-cover person cutouts (composite.py). If it ever
          # fails to install, write.py falls back to plain photo covers.
          pip install pillow rembg onnxruntime

      - name: Cache rembg model
        if: github.event.inputs.repost == ''
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net

      - name: Fetch news and write post
        if: github.event.inputs.repost == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CHROME: google-chrome
          # run 32741313256 (Aug 24): a writer response blew past the CLI's
          # default 32k output-token cap and the slot died. This is a cap,
          # not a target — raising it costs nothing on normal calls.
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "64000"
        run: |
          set -o pipefail
          cd ig
          # culture radar warm-up (run diet Aug 12): the refresh was burning
          # ~3 min INSIDE art_direct on every run because culture.json was
          # never committed (stale on every checkout since Aug 9). It now
          # refreshes in the background while scout+writer work, and the save
          # step commits it — one web-search call per day, as designed.
          python culture.py > /tmp/culture-refresh.log 2>&1 &
          python scout.py   # X watchlist radar.json ONLY (owner order Aug 3) -> stories.json
          # SLOT MIX (owner match-the-data order Aug 27 — mirror the measured
          # winner mix: story arcs and wow facts ride the news slots via the
          # evergreen bench in scout.py):
          #   13:00 UTC              = guide (most-viral X guide, 7-day pool)
          #   16:00 + 17:00 + 21:00  = news/story (most-viral of the day)
          #   01:00 UTC (~9pm ET)    = daily recap (measured 2,555 likes/1M;
          #                            @technology's 2 biggest posts ever are
          #                            roundups — Jul 31 removal predates data)
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ] || [ "$KIND" = "auto" ]; then
            # slot identity from the CRON LINE, not the wall clock (Sep 3:
            # free-tier crons fire hours late — the recap slot ran at 05:24,
            # matched no hour, and the page shipped 0 recaps since Aug 27)
            case "${{ github.event.schedule }}" in
              "0 13 * * *") KIND=edu ;;
              "0 1 * * *")  KIND=recap ;;
              "")  # manual dispatch with kind=auto — fall back to the hour
                case "$(date -u +%H)" in
                  13) KIND=edu ;;
                  01) KIND=recap ;;
                  *)  KIND=story ;;
                esac ;;
              *) KIND=story ;;
            esac
          fi
          # Every branch ends in a fallback rung (owner rule: 7/day is a MUST,
          # a slot is never skipped). edu.py is the evergreen last resort — it
          # doesn't depend on the news pool, so "no usable story" (all dupes,
          # issue #7) can't kill a slot. money = story flow with a case-study
          # preference (STORY_PREF), same fallback ladder as story.
          # THIRD RUNG (run 30752019189, Aug 2: both rungs failed QA 3x and the
          # slot died): one more fresh edu.py roll — a new sample usually passes
          # EDU_FORCE floor (run 33907282064, Sep 4: ALL rungs died and the
          # slot shipped nothing): the last rung gets extra QA rolls and on
          # exhaustion ships flagged (qa_override, named in the daily report)
          # — dupes are still never forced through
          # STORY_RELAX rung (owner audit Aug 27): every story slot Aug 13-27
          # fell straight to the edu floor — 71/71 carousels were listicles,
          # the exact "6 things you can do with AI" repetition the owner
          # flagged. Before the listicle floor, retry write.py with Gate A
          # kills relaxed: the most viral NON-DUPE story ships as a news
          # narrative (Gate B still reviews the finished post).
          if [ "$KIND" = "edu" ]; then
            # EXECUTIVE LANE (owner order Aug 18): the 13:00 slot alternates
            # daily — even day-of-year = executive intelligence edition
            # (framework posts for founders/CEOs), odd = skills save-magnet.
            # Fallback rungs run in default skills mode (always-post law).
            if [ $((10#$(date -u +%j) % 2)) -eq 0 ]; then export EDU_MODE=exec; fi
            python edu.py | tee /tmp/write.log || EDU_MODE= python write.py | tee /tmp/write.log || EDU_MODE= STORY_RELAX=1 python write.py | tee /tmp/write.log || EDU_MODE= EDU_FORCE=1 python edu.py | tee /tmp/write.log
          elif [ "$KIND" = "money" ]; then
            STORY_PREF=money python write.py | tee /tmp/write.log || STORY_PREF=money STORY_RELAX=1 python write.py | tee /tmp/write.log || STORY_PREF=money STORY_RELAX=1 STORY_FORCE=1 python write.py | tee /tmp/write.log || EDU_FORCE=1 python edu.py | tee /tmp/write.log
          elif [ "$KIND" = "recap" ]; then
            # daily recap (owner match-the-data order Aug 27); a failed recap
            # never skips the slot — news ladder fills it (always-post law)
            python recap.py | tee /tmp/write.log || python write.py | tee /tmp/write.log || STORY_RELAX=1 python write.py | tee /tmp/write.log || STORY_RELAX=1 STORY_FORCE=1 python write.py | tee /tmp/write.log || EDU_FORCE=1 python edu.py | tee /tmp/write.log
          else
            # NEWS PAGE FIRST (owner order Sep 3): a news slot exhausts every
            # story rung before the guide floor — rung 3 (STORY_FORCE) ships
            # the most viral non-dupe story over a Gate B reject, FLAGGED
            # (mechanical qa still binding). edu.py is the absolute floor
            # only, never the second rung — Aug 13-Sep 3 it filled nearly
            # every news slot and the page became the guide-flood the owner
            # named its #1 content failure.
            python write.py | tee /tmp/write.log || STORY_RELAX=1 python write.py | tee /tmp/write.log || STORY_RELAX=1 STORY_FORCE=1 python write.py | tee /tmp/write.log || EDU_FORCE=1 python edu.py | tee /tmp/write.log
          fi
          POST_DIR=$(sed -n 's/^post ready: //p' /tmp/write.log)
          test -n "$POST_DIR"  # fail loudly if the writer produced nothing
          echo "POST_DIR=$POST_DIR" >> "$GITHUB_ENV"
          echo "POST_NAME=$(basename "$POST_DIR")" >> "$GITHUB_ENV"

      - name: Push slides to public media repo
        # runs for reposts too — IG fetches slides from this repo, so publishing
        # without pushing them 404s at Meta ("Only photo or video...", err 9004)
        env:
          TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/saaryafe-crypto/kestrel-media.git" /tmp/media
          mkdir -p "/tmp/media/$POST_NAME"
          cp "$POST_DIR"/slide-*.jpg "/tmp/media/$POST_NAME/"
          cp "$POST_DIR"/video-*.mp4 "/tmp/media/$POST_NAME/" 2>/dev/null || true
          cd /tmp/media
          git config user.name "ig-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "$POST_NAME" || echo "slides already in media repo"
          git pull --rebase || true   # another workflow may have pushed first
          git push

      - name: Duplicate guard (a sibling run may have published while we rendered)
        # Aug 3 (HE dup post-mortem): generation takes 20-50 min; if another
        # run committed this exact post dir to main in that window, it is
        # already live. Reposts skip this on purpose — republishing is their job.
        if: github.event.inputs.repost == ''
        run: |
          git fetch origin main --quiet
          if git cat-file -e "origin/main:$POST_DIR/post.json" 2>/dev/null; then
            echo "$POST_DIR is already on main — a sibling run published it. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Publish carousel to Instagram
        if: env.SKIP != 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          GH_TOKEN: ${{ github.token }}  # bare-cover alert issues (post.py)
        run: |
          python ig/post.py "$POST_DIR" \
            "https://raw.githubusercontent.com/saaryafe-crypto/kestrel-media/main/$POST_NAME"

      - name: Save post to this repo (dedupe history)
        # Runs LAST on purpose (run 30759942650 post-mortem, Aug 2): a git race
        # here must never kill the publish — if this step fails the post is
        # already live and only the history commit is lost (alert issue fires).
        if: github.event.inputs.repost == '' && env.SKIP != 'true'
        run: |
          git config user.name "ig-bot"
          git config user.email "bot@users.noreply.github.com"
          # semantic merge for the shared ledgers (.gitattributes merge=ledger):
          # parallel runs touching the same JSON always text-conflict otherwise
          git config merge.ledger.driver "python ig/merge_ledgers.py %O %A %B"
          # ONLY this run's post dir (Aug 4, run 30904399838 post-mortem):
          # "git add ig/posts" swept a HALF-BUILT dir from a failed write.py
          # attempt into a sibling's commit, and the real publisher of that
          # story then died on add/add rebase conflicts at its save step
          git add "$POST_DIR"
          git add ig/edu-used.json 2>/dev/null || true
          git add ig/genimg-used.json 2>/dev/null || true  # image-gen budget ledger must persist across runs
          git add ig/faces-used.json 2>/dev/null || true   # face-photo rotation ledger (never repeat the same press photo back-to-back)
          git add ig/editor-log.json 2>/dev/null || true   # editor-in-chief audit trail: every gate A/B verdict must survive the runner
          git add ig/culture.json 2>/dev/null || true      # daily culture radar: uncommitted = every run re-pays the web-search refresh
          git commit -m "IG post: $POST_NAME" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash   # autostash: fetch.py leaves stories.json dirty; don't let it kill the run
          git push || { git pull --rebase --autostash && git push; }  # retry once if a sibling pushed in between

      - name: Alert on failure (opens a GitHub issue -> email notification)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "IG autopost FAILED $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "Something broke — no post went out for this slot. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
