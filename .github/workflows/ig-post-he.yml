name: IG news card HE
# Fires 2-3h before each slot (GitHub crons run late); _news.yml builds,
# then waits until the slot's local time (pages.py) and publishes.
on:
  schedule:
    - cron: "7 3 * * *"   # 0 slot 08:00 Israel
    - cron: "7 8 * * *"   # 1 slot 13:00 Israel
    - cron: "37 15 * * *"   # 2 slot 20:30 Israel
  workflow_dispatch:
    inputs:
      slot:
        description: "slot index from pages.py, or now"
        default: "now"

concurrency:
  group: ig-card-he
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.s.outputs.slot }}
    steps:
      - id: s
        run: |
          case "${{ github.event.schedule }}" in
            "7 3 * * *") s=0 ;;
            "7 8 * * *") s=1 ;;
            "37 15 * * *") s=2 ;;
            *) s="${{ inputs.slot || 'now' }}" ;;
          esac
          echo "slot=$s" >> "$GITHUB_OUTPUT"
  run:
    needs: slot
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/_news.yml
    with:
      lang: he
      kind: card
      slot: ${{ needs.slot.outputs.slot }}
    secrets: inherit
