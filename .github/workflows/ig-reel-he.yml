name: IG reel HE
# Fires 2-3h before each slot (GitHub crons run late); _news.yml builds,
# then waits until the slot's local time (pages.py) and publishes.
on:
  schedule:
    - cron: "7 13 * * *"   # 0 slot 18:00 Israel
    - cron: "7 17 * * *"   # 1 slot 22:00 Israel
  workflow_dispatch:
    inputs:
      slot:
        description: "slot index from pages.py, or now"
        default: "now"

concurrency:
  group: ig-reel-he
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.s.outputs.slot }}
    steps:
      - id: s
        run: |
          case "${{ github.event.schedule }}" in
            "7 13 * * *") s=0 ;;
            "7 17 * * *") s=1 ;;
            *) s="${{ inputs.slot || 'now' }}" ;;
          esac
          echo "slot=$s" >> "$GITHUB_OUTPUT"
  run:
    needs: slot
    uses: ./.github/workflows/_news.yml
    with:
      lang: he
      kind: reel
      slot: ${{ needs.slot.outputs.slot }}
    secrets: inherit
