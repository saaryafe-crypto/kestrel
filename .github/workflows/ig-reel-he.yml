name: IG reel publish HE
# Hebrew arm (@ainews.israel): publishes an already-built Hebrew reel (video
# in the media repo under <post>-he, reel.json in ig/posts-he/<post>) via the
# Hebrew Make webhook's reel route. Triggered by reel_he.py on the Mac after
# it pushes the video, or manually. The English system is frozen — this
# workflow only ADDS (owner rule Jul 29).

on:
  workflow_dispatch:
    inputs:
      post:
        description: "post dir name, e.g. 2026-07-29-reel-XXXXXXXX"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish Hebrew reel to Instagram (ainews.israel)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL_HE }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: |
          POST="${{ github.event.inputs.post }}"
          test -f "ig/posts-he/$POST/reel.json"
          python3 ig/post.py "ig/posts-he/$POST" \
            "https://raw.githubusercontent.com/saaryafe-crypto/kestrel-media/main/$POST-he"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "IG HE reel publish FAILED $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "Post: ${{ github.event.inputs.post }} — logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
